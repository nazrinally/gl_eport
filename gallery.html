<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Documents - Game Developer Portfolio</title>
    <link rel="stylesheet" href="css/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Navigation -->
    <nav class="navbar">
        <div class="nav-brand">Nazrin Ally</div>
        <div class="nav-toggle">
            <span></span>
            <span></span>
            <span></span>
        </div>
        <ul class="nav-menu">
            <li><a href="index.html">Home</a></li>
            <li><a href="about.html">About</a></li>
            <li><a href="project.html">Project</a></li>
            <li><a href="features.html">Progression</a></li>
            <li><a href="gallery.html" class="active">Documents</a></li>
        </ul>
    </nav>

    <!-- Documents Content -->
    <main class="page-content">
        <section id="gallery" class="section">
            <div class="thumbdrives-container">
                <div class="thumbdrive" id="projectProposal">
                    <div class="usb-body">
                        <div class="usb-main">
                            <span class="thumbdrive-label">Project Proposal</span>
                        </div>
                        <div class="usb-connector"></div>
                    </div>
                </div>
                <div class="thumbdrive" id="learningContract">
                    <div class="usb-body">
                        <div class="usb-main">
                            <span class="thumbdrive-label">Learning Contract</span>
                        </div>
                        <div class="usb-connector"></div>
                    </div>
                </div>
                <div class="thumbdrive" id="learningLog">
                    <div class="usb-body">
                        <div class="usb-main">
                            <span class="thumbdrive-label">Learning Log</span>
                        </div>
                        <div class="usb-connector"></div>
                    </div>
                </div>
            </div>
            
            <!-- PDF Viewer Modal -->
            <div id="pdfModal" class="pdf-modal" style="display: none;">
                <div class="pdf-modal-content">
                    <button class="pdf-close-btn" onclick="closePdfModal()">×</button>
                    <iframe id="pdfViewer" class="pdf-iframe"></iframe>
                </div>
            </div>
        </section>
    </main>

    <script src="js/main.js"></script>
    <script src="js/gallery.js"></script>
    <script>
        // PDF file paths
        const pdfFiles = {
            'projectProposal': 'assets/Student Initiated Proposal Form_NazrinAlly_240459H.pdf',
            'learningContract': 'assets/LearningContract_Nazrin.pdf',
            'learningLog': 'assets/My Learning Log-4 Nazrin.pdf'
        };
        
        // Handle thumbdrive clicks
        document.getElementById('projectProposal').addEventListener('click', function() {
            openPdf(pdfFiles.projectProposal);
        });
        
        document.getElementById('learningContract').addEventListener('click', function() {
            openPdf(pdfFiles.learningContract);
        });
        
        document.getElementById('learningLog').addEventListener('click', function() {
            openPdf(pdfFiles.learningLog);
        });
        
        function openPdf(pdfPath) {
            // Display PDF in modal
            document.getElementById('pdfViewer').src = pdfPath;
            document.getElementById('pdfModal').style.display = 'flex';
        }
        
        function closePdfModal() {
            document.getElementById('pdfModal').style.display = 'none';
            document.getElementById('pdfViewer').src = '';
        }
    </script>
</body>
</html>
